name: Build signed installers

# Produces verified artifacts for review. Public publication is deliberately separate
# until credentials are enrolled and both platforms have been tested.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform (Windows hosted runner uses Azure Public Trust)'
        required: true
        type: choice
        options: [both, mac, windows]
        default: both

permissions:
  contents: read

concurrency:
  group: signed-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    if: github.ref == 'refs/heads/main' && inputs.platform != 'windows'
    runs-on: macos-latest
    environment: signing
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:helper
      - run: npm test
      - name: Sign and notarize app and DMG, then verify tickets
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          node -e 'for (const name of ["CSC_LINK", "CSC_KEY_PASSWORD", "APPLE_API_KEY_CONTENT"]) { if (!process.env[name]) throw new Error(`Missing signing secret: ${name}`) }'
          export APPLE_API_KEY="$RUNNER_TEMP/desksignal-notary-key.p8"
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          node -e 'require("node:fs").writeFileSync(process.env.APPLE_API_KEY, process.env.APPLE_API_KEY_CONTENT, {mode: 0o600})'
          npm run dist:mac:signed
      - name: Save verified Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-mac
          if-no-files-found: error
          retention-days: 7
          path: |
            release-signed/DeskSignal-*-arm64.dmg
            release-signed/mac-notarization.json

  windows:
    if: github.ref == 'refs/heads/main' && inputs.platform != 'mac'
    runs-on: windows-latest
    environment: signing
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:helper
      - run: npm test
      - name: Sign and verify app, native helper and installer
        env:
          DS_WINDOWS_SIGNING_PROVIDER: azure
          DS_WINDOWS_PUBLISHER: ${{ vars.DS_WINDOWS_PUBLISHER }}
          DS_AZURE_SIGNING_ENDPOINT: ${{ vars.DS_AZURE_SIGNING_ENDPOINT }}
          DS_AZURE_SIGNING_ACCOUNT: ${{ vars.DS_AZURE_SIGNING_ACCOUNT }}
          DS_AZURE_CERTIFICATE_PROFILE: ${{ vars.DS_AZURE_CERTIFICATE_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: npm run dist:win:signed
      - name: Save verified Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows
          if-no-files-found: error
          retention-days: 7
          path: |
            release-signed/DeskSignal-Setup-*.exe
            release-signed/DeskSignal-Setup-*.exe.blockmap
            release-signed/latest.yml
